name: Automatická aktualizace jídelníčku

on:
  schedule:
    # 22:01 UTC v zimním čase = 23:01 / v letním čase 0:01 SEČ
    - cron: '1 00 * * 1'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Načtení repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalace závislostí a prohlížeče
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Spuštění skriptu pro stažení jídelníčku
        run: python fetch_menu.py

      - name: Uložení data.json do GitHubu
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update jídelníčku [skip ci]" || echo "Žádné změny k uložení"
          git push
