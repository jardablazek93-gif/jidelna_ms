name: Automatická aktualizace jídelníčku

on:
  schedule:
    - cron: '0 20 * * 0'
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Načtení repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Spuštění skriptu pro stažení jídelníčku
        run: python fetch_menu.py

      - name: Uložení zmeněného data.json do GitHubu
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update jídelníčku [skip ci]" && git push)
